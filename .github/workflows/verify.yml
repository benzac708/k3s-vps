name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts pass shellcheck
        run: shellcheck -S warning install.sh platform/bootstrap.sh
      - name: Scripts are executable
        run: test -x install.sh && test -x platform/bootstrap.sh
      - name: YAML lint
        run: |
          pip install -q yamllint
          yamllint -d '{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}' ingress/ tls/ platform/
      - name: No placeholders left behind
        run: "! grep -rn REPLACE_ME ingress/ tls/ platform/ README.md install.sh 2>/dev/null"
      - name: No secrets in tree
        uses: gitleaks/gitleaks-action@v2
      - name: Install kubeconform
        run: |
          curl -sL --max-time 120 -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform && sudo mv kubeconform /usr/local/bin/ && kubeconform -v
      - name: Manifests conform to Kubernetes schemas
        run: kubeconform -kubernetes-version 1.36.0 -strict -schema-locations 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -schema-locations default platform/ollama.yaml platform/ollama-access.yaml ingress/demo-ingress.yaml tls/cluster-issuer.yaml
