# ai-platform has a default-deny-ingress policy (all pods). Ollama is a
# shared platform service, so it explicitly opens 11434 to cluster pods.
# Single-tenant box: pod-wide allowance is proportionate; the default-deny
# stays untouched for everything else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-allow-cluster
  namespace: ai-platform
spec:
  podSelector:
    matchLabels: {app: ollama}
  policyTypes: [Ingress]
  ingress:
  - ports:
    - port: 11434
