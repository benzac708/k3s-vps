# The ai-platform namespace is default-deny for ingress. Only AskVault pods
# need the shared embedding endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-allow-askvault
  namespace: ai-platform
spec:
  podSelector:
    matchLabels:
      app: ollama
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: askvault
      ports:
        - {protocol: TCP, port: 11434}
